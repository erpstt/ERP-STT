name: Security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DISABLE_BACKGROUND_JOBS: "true"
      EMAIL_NOTIFICATIONS_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.1"
          package-manager-cache: false

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --include=dev --no-audit --no-fund

      - name: Build trusted templates and TypeScript
        run: npm run build

      - name: Install Chromium for isolated report browser tests
        run: node node_modules/playwright/cli.js install --with-deps --only-shell chromium

      - name: Run explicit isolated security tests
        env:
          NODE_ENV: test
        run: |
          node --test --test-concurrency=1 \
            scripts/public-app-url.test.mjs \
            scripts/security-turnstile.test.mjs \
            scripts/password-recovery.test.mjs \
            scripts/password-recovery-ui.test.mjs \
            scripts/user-invitation-email.test.mjs \
