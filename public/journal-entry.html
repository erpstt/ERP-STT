<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Crear asiento</title><link rel="stylesheet" href="/dashboard.css"><link rel="stylesheet" href="/journal-entry.css"></head><body><main class="journal-page"><header><div><small>CONTABILIDAD</small><h1>Crear asiento de diario</h1></div><a href="/">Volver</a></header><section><h2>Información principal</h2><div class="header-grid"><label>Tipo de asiento<select id="journalType"><option>Estándar</option><option>Ajuste</option><option>Apertura</option><option>Cierre</option></select></label><label>Subsidiaria<input id="subsidiary" readonly></label><label>Ubicación<input id="location" readonly></label><label>Fecha<input id="journalDate" type="date"></label><label>Período contable<select id="period" disabled></select></label><label>Moneda<select id="currency"></select></label><label>Tipo de cambio<input id="rate" type="number" step="any" readonly></label><label class="wide">Nota<textarea id="memo"></textarea></label></div><div class="totals"><b>Débitos: <span id="debits">0.00</span></b><b>Créditos: <span id="credits">0.00</span></b><strong id="balance">Sin balancear</strong></div></section><section><h2>Líneas del asiento</h2><div class="line-scroll"><table><thead><tr><th>Número de cuenta</th><th>Nombre de cuenta</th><th>Débito</th><th>Crédito</th><th>Código impuesto</th><th>Tasa</th><th>Importe bruto</th><th>Nota</th><th>Entidad</th><th>Nombre</th><th>Departamento</th><th>Clase</th><th>Centro costos</th><th>Acreedor financiero</th><th>Compañía relacionada</th><th></th></tr></thead><tbody id="lines"></tbody></table></div><button id="addLine">＋ Agregar línea</button></section><p id="error"></p><footer><button id="cancel">Cancelar</button><button id="save">Guardar asiento</button></footer></main><script type="module" src="/journal-entry.js"></script></body></html>
