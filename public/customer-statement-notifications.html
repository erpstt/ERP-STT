<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estados de cuenta y comunicaciones</title><link rel="stylesheet" href="/notification-templates.css"><style>table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e2e8f0}dialog{max-width:550px;width:90%;border:1px solid #cbd5e1;border-radius:12px;padding:24px}dialog::backdrop{background:#0f172a88}textarea{width:100%;min-height:100px;padding:12px}#balance{font-size:24px;font-weight:bold}.table-scroll{overflow:auto}</style></head><body><main><p class="eyebrow">CUENTAS POR COBRAR</p><h1 id="name">Estados de cuenta</h1><p id="transport" class="notice"></p><p id="message" role="status"></p><section><label for="cutoff">Fecha de corte</label><input type="date" id="cutoff"><p id="balance"></p><p id="email"></p><div class="actions"><button id="refresh">Actualizar</button><button id="pdf" disabled>Descargar PDF</button><button id="compose" disabled>Enviar Estado de Cuenta</button></div></section><section style="margin-top:20px"><h2>Historial de Comunicaciones</h2><p class="help">Enviado significa que el servidor de correo aceptó el mensaje, no que el cliente lo leyó.</p><div class="table-scroll"><table><thead><tr><th>Registro</th><th>Corte</th><th>Destinatario</th><th>Estado</th><th>Fecha de envío / detalle</th></tr></thead><tbody id="history"></tbody></table></div></section></main><dialog id="confirmation"><form id="sendForm"><h2>Enviar Estado de Cuenta</h2><p>Se enviará el PDF al correo registrado del cliente:</p><strong id="recipient"></strong><p id="sendSummary"></p><label for="note">Nota adicional (opcional)</label><textarea id="note" maxlength="2000"></textarea><p id="sendError" role="status"></p><div class="actions"><button type="button" id="cancel">Cancelar</button><button type="submit" id="confirmSend">Confirmar envío</button></div></form></dialog><script type="module" src="/customer-statement-notifications.js"></script></body></html>
