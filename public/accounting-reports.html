<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reportes de Contabilidad · NEXO</title><link rel="stylesheet" href="/accounting-reports.css"><link rel="stylesheet" href="/accounting-income-statement.css"></head><body>
<header><a href="/" class="brand">▮▮ NEXO</a><div><b>Informes · Contabilidad</b><button id="back">Volver al ERP</button></div></header>
<main><section id="dashboard"><p class="eyebrow">INFORMES · CONTABILIDAD</p><h1>Reportes de Contabilidad</h1><p>Estados financieros, libros auxiliares y control contable multiempresa.</p><h2>Estados Financieros Principales</h2><div class="cards" id="financial"></div><h2>Reportes Operativos y de Control Contable</h2><div class="cards" id="operational"></div></section>
<section id="workspace" hidden><button class="link" id="catalog">← Todos los reportes</button><div class="title"><div><p class="eyebrow">REPORTE CONTABLE</p><h1 id="reportTitle"></h1><p id="reportDescription"></p></div><div class="exports"><button id="pdf">PDF</button><button id="excel">Excel (.XLSX)</button><button id="csv">CSV</button></div></div>
<form id="filters"><label>Subsidiaria<select id="subsidiaries" required></select></label><label>Libro contable<select id="book"></select></label><label>Periodo<select id="period"></select></label><label>Desde<input id="from" type="date" required></label><label>Hasta<input id="to" type="date" required></label><label>Moneda local<select id="currency" disabled></select></label><label>Tipo de departamento<select id="departmentType"><option value="">Cliente e Interno</option><option>Cliente</option><option>Interno</option></select></label><label>Departamento<select id="department"></select></label><label>Ubicación<select id="location"></select></label><label>Clase<select id="class"></select></label><label>Centro de costo<select id="costCenter"></select></label><label>Nivel<select id="hierarchy"><option>1</option><option>2</option><option>3</option><option selected>4</option></select></label><label class="check"><input id="zero" type="checkbox" checked> Excluir saldos cero</label><button class="primary" type="submit">Generar reporte</button></form>
<div id="message"></div><div class="summary" id="summary"></div><div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><footer class="pager"><span id="count"></span><label>Filas <select id="pageSize"><option>25</option><option selected>50</option><option>100</option><option>250</option></select></label><button id="prev">Anterior</button><span id="page"></span><button id="next">Siguiente</button></footer></section></main>
<script type="module" src="/accounting-reports.js"></script></body></html>
