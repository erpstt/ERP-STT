<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diseñador PDF</title><link rel="stylesheet" href="/pdf-templates.css"></head><body class="builder"><header class="builder-bar"><button id="back">← Plantillas</button><input id="name" placeholder="Nombre de la plantilla"><select id="type"></select><select id="page"><option>A4</option><option value="LETTER">Carta</option><option value="THERMAL_80">Térmico 80 mm</option></select><select id="orientation"><option value="PORTRAIT">Vertical</option><option value="LANDSCAPE">Horizontal</option></select><select id="branch"><option value="">Toda la subsidiaria</option></select><label><input type="checkbox" id="default"> Predeterminada</label><button id="preview">Vista previa</button><button class="primary" id="save">Guardar</button></header><div class="builder-grid"><aside class="palette"><h2>Componentes</h2><p>Arrastre o haga clic para agregar.</p><div id="palette"></div><h3>Márgenes (mm)</h3><div class="margin-grid"><label>Superior<input type="number" id="mt"></label><label>Derecho<input type="number" id="mr"></label><label>Inferior<input type="number" id="mb"></label><label>Izquierdo<input type="number" id="ml"></label></div></aside><section class="canvas-wrap"><div id="canvas" class="paper"><section><b>ENCABEZADO</b><div class="dropzone" data-zone="header"></div></section><section class="body-zone"><b>CUERPO</b><div class="dropzone" data-zone="body"></div></section><section><b>PIE DE PÁGINA</b><div class="dropzone" data-zone="footer"></div></section></div></section><aside class="inspector"><h2>Propiedades</h2><div id="empty">Seleccione un componente.</div><form id="props" hidden><label>Contenido<textarea id="content"></textarea></label><label>Variable<select id="binding"></select></label><div class="two"><label>Tamaño<input id="fontSize" type="number" min="7" max="48"></label><label>Color<input id="color" type="color"></label></div><label>Alineación<select id="align"><option>left</option><option>center</option><option>right</option></select></label><label><input id="bold" type="checkbox"> Negrita</label><label><input id="border" type="checkbox"> Borde</label><button type="button" class="danger" id="remove">Eliminar componente</button></form></aside></div><dialog id="previewDialog"><div class="preview-bar"><b>Vista previa</b><select id="previewMode"><option value="mock">Datos de ejemplo</option><option value="real">Documento real</option></select><input id="documentNumber" placeholder="Número del documento"><button id="refreshPreview">Actualizar</button><button id="printPreview">Descargar / imprimir PDF</button><button id="closePreview">Cerrar</button></div><iframe id="previewFrame"></iframe></dialog><div id="toast"></div><script type="module" src="/pdf-template-builder.js"></script></body></html>
