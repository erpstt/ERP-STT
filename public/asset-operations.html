<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operaciones de activos · NEXO</title><link rel="stylesheet" href="/fixed-assets.css?v=5"><link rel="stylesheet" href="/asset-operations.css?v=1"></head>
<body><header><a href="/" class="brand">▮▮ NEXO</a><a href="/">Volver al ERP</a></header><main>
<div class="title"><div><p class="eyebrow" id="code"></p><h1 id="title"></h1><p id="subtitle"></p></div><button id="new" class="primary green"></button></div>
<form id="filters" class="panel filters"><label>Fecha desde<input id="from" type="date"></label><label>Fecha hasta<input id="to" type="date"></label><label class="grow">Buscar<input id="search" placeholder="Número, activo, referencia o descripción"></label><button class="primary">Aplicar filtros</button></form><p id="message"></p>
<section class="panel"><div class="table-meta"><b id="detailTitle"></b><span id="count"></span></div><div class="table-wrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div></section></main>
<div id="modal" class="overlay" hidden><form id="entry" class="dialog operation-dialog"><div class="dialog-head"><div><p class="eyebrow" id="formCode"></p><h2 id="formTitle"></h2></div><button id="close" type="button" class="icon">×</button></div><section class="grid operation-grid">
<label>Número<input id="number" class="readonly" value="Se asignará al guardar" readonly></label><label>Fecha<input id="date" type="date" required></label><label class="wide">Activo<select id="asset" required></select></label>
<div id="transferFields" class="conditional full grid inner-grid"><label>Subsidiaria origen<input id="sourceSubsidiary" class="readonly" readonly></label><label>Ubicación origen<input id="sourceLocation" class="readonly" readonly></label><label>Subsidiaria destino<select id="targetSubsidiary"></select></label><label>Ubicación destino<select id="targetLocation"></select></label><label class="full">Nota<textarea id="transferNote"></textarea></label></div>
<div id="disposalFields" class="conditional full grid inner-grid"><label>Tipo de operación<select id="disposalType"><option value="BAJA">Baja</option><option value="VENTA">Venta</option><option value="DONACION">Donación</option><option value="PERDIDA">Pérdida</option></select></label><label>Valor en libros<input id="bookValue" class="readonly num-field" readonly></label><label>Monto de venta<input id="saleAmount" class="num-field" inputmode="decimal"></label><label>Ganancia / pérdida<input id="gainLoss" class="readonly num-field" readonly></label><label class="full">Motivo / nota<textarea id="disposalNote"></textarea></label></div>
<div id="maintenanceFields" class="conditional full grid inner-grid"><label>Tipo<select id="maintenanceType"><option value="PREVENTIVO">Preventivo</option><option value="CORRECTIVO">Correctivo</option></select></label><label>Estado<select id="maintenanceStatus"><option value="PROGRAMADO">Programado</option><option value="EN PROCESO">En proceso</option><option value="COMPLETADO">Completado</option><option value="CANCELADO">Cancelado</option></select></label><label>Fecha de finalización<input id="completionDate" type="date"></label><label>Proveedor<select id="supplier"></select></label><label>Referencia<input id="reference"></label><label>Costo<input id="maintenanceCost" class="num-field" inputmode="decimal"></label><label class="full">Descripción del mantenimiento<textarea id="maintenanceDescription"></textarea></label></div>
</section><footer><span id="formHint"></span><div><button id="cancel" type="button">Cancelar</button><button id="save" class="primary green">Guardar</button></div></footer></form></div>
<div id="viewer" class="overlay" hidden><section class="dialog view-dialog"><div class="dialog-head"><div><p class="eyebrow" id="viewCode"></p><h2 id="viewTitle"></h2></div><button id="viewClose" type="button" class="icon">×</button></div><div id="viewContent" class="view-content"></div><footer><span></span><button id="viewBack" type="button" class="primary green">Cerrar</button></footer></section></div>
<script type="module" src="/asset-operations.js?v=1"></script></body></html>
