<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nota de venta</title><link rel="stylesheet" href="/sales-invoice-view.css"><link rel="stylesheet" href="/sales-invoice-print.css"></head><body><nav class="toolbar"><button id="back">Volver</button><a id="edit">Editar</a><button id="print" class="primary">Descargar PDF</button></nav><main id="invoice" class="invoice" hidden><header class="document-header"><div class="company-copy"><img id="logo" class="logo" hidden><div><h1 id="companyName"></h1><p id="companyAddress"></p></div></div><div class="document-identity"><small id="type"></small><strong id="number"></strong><span>CONTABILIZADA</span></div></header><section class="parties"><div class="customer-card"><h2>Cliente</h2><strong id="customer"></strong><p id="taxId"></p></div><dl class="document-data"><div><dt>Factura relacionada</dt><dd id="related"></dd></div><div><dt>Fecha</dt><dd id="date"></dd></div><div><dt>Moneda</dt><dd id="currency"></dd></div></dl></section><section class="lines-section"><table><thead><tr><th>Producto / descripción</th><th class="number">Cantidad</th><th class="number">Precio</th><th class="number">Subtotal</th><th class="number">Impuesto</th><th class="number">Total</th></tr></thead><tbody id="lines"></tbody></table></section><section class="closing"><div class="notes"><h2>Nota</h2><p id="memo"></p></div><div></div><dl class="totals"><div><dt>Subtotal</dt><dd id="subtotal"></dd></div><div><dt>Impuestos</dt><dd id="tax"></dd></div><div class="grand-total"><dt>Total</dt><dd id="total"></dd></div></dl></section><footer class="document-footer"><span id="footerCompany"></span><span>Documento generado desde NEXO ERP</span></footer></main><p id="error"></p><script type="module" src="/sales-note-view.js?v=1"></script></body></html>
