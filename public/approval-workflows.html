<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Configuración de flujos de aprobación</title><link rel="stylesheet" href="/approval-engine.css"></head><body><main><header><div><span class="eyebrow">WORKFLOW · CONFIGURACIÓN</span><h1>Flujos de aprobación</h1><p class="muted">Reglas multinivel reutilizables por subsidiaria y tipo de documento.</p></div><div class="actions"><a class="button" href="/approval-inbox.html">Mis aprobaciones</a><button id="new" class="primary">+ Nuevo flujo</button></div></header><p id="message" class="message"></p><section class="card"><div class="card-head"><h2>Flujos configurados</h2></div><div id="list" class="content list"></div></section><section id="editor" class="card" hidden><div class="card-head between"><h2 id="formTitle">Nuevo flujo</h2><button id="close">Cerrar</button></div><form id="form" class="content"><div class="grid"><label>Nombre<input id="name" required></label><label>Entidad destino<select id="entity" required></select></label><label>Estado<select id="active"><option value="true">Activo</option><option value="false">Inactivo</option></select></label><label class="wide">Descripción<textarea id="description"></textarea></label></div><div class="between" style="margin-top:22px"><div><h2>Secuencia de aprobación</h2><p class="muted">Los niveles se ejecutan en el orden mostrado.</p></div><button id="addRule" type="button">+ Agregar nivel</button></div><div id="rules"></div><div class="actions" style="justify-content:flex-end;margin-top:20px"><button id="cancel" type="button">Cancelar</button><button class="primary">Guardar flujo</button></div></form></section></main><script type="module" src="/approval-workflows.js?v=1"></script></body></html>
