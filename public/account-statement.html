<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estado de cuenta</title><link rel="stylesheet" href="/account-statement.css?v=1"></head><body>
<nav><button id="back">Volver</button><button id="print">Descargar PDF</button></nav>
<main id="statement" hidden><header><div class="brand"><img id="logo" hidden><div><h1 id="company"></h1><p id="companyAddress"></p></div></div><div class="identity"><small id="statementType"></small><strong>ESTADO DE CUENTA</strong><span id="cutoff"></span></div></header>
<section class="party"><div><small id="partyLabel"></small><h2 id="partyName"></h2><p id="partyCode"></p><p id="partyTax"></p><p id="partyContact"></p></div><div class="balance"><small>SALDO PENDIENTE</small><strong id="balance"></strong><span id="currencyLabel"></span></div></section>
<section><h3>Resumen de antigüedad</h3><div id="aging" class="aging"></div></section>
<section><h3>Documentos pendientes</h3><table><thead><tr><th>Documento</th><th>Emisión</th><th>Vencimiento</th><th class="num">Días</th><th class="num">Monto original</th><th class="num">Aplicado</th><th class="num">Saldo</th></tr></thead><tbody id="documents"></tbody><tfoot><tr><th colspan="6">Saldo pendiente</th><th id="documentTotal" class="num"></th></tr></tfoot></table></section>
<section class="summary"><div><small>Saldo de documentos</small><strong id="invoiceBalance"></strong></div><div><small>Anticipos / sin aplicar</small><strong id="advances"></strong></div><div class="net"><small>Saldo neto</small><strong id="netBalance"></strong></div></section>
<footer><span id="footerCompany"></span><span>Documento generado desde NEXO ERP</span></footer></main><p id="error"></p><script type="module" src="/account-statement.js?v=1"></script></body></html>
