<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Factura de venta</title><link rel="stylesheet" href="/journal-entry.css"></head><body><main class="journal-page"><header><div><small>VENTAS · CUENTAS POR COBRAR</small><h1>Crear factura de venta</h1></div><button id="back" class="button-link" type="button">Volver</button></header><section><h2>Información principal</h2><div class="header-grid"><label>Número de factura<input id="number" value="Se asignará al guardar" readonly></label><label>Cliente<select id="customer"></select></label><label>Términos de pago<select id="term"></select></label><label>Subsidiaria<select id="subsidiary" disabled></select></label><label>Ubicación<select id="location" disabled></select></label><label>Fecha<input id="date" type="date"></label><label>Período<select id="period" disabled></select></label><label>Moneda<select id="currency"></select></label><label>Tipo de cambio<input id="rate"></label><label class="wide">Nota<textarea id="memo"></textarea></label></div><div class="totals"><b>Subtotal: <span id="subtotal">0,00</span></b><b>Impuestos: <span id="taxTotal">0,00</span></b><b>Total: <span id="total">0,00</span></b></div></section><section><div class="tabs"><button class="active">Líneas de factura</button><button>Impacto contable</button><button>Archivos de respaldo</button></div><div class="line-scroll"><table><thead><tr><th>Producto</th><th>Cantidad</th><th>Precio unitario</th><th>Importe</th><th>Código impuesto</th><th>Tasa</th><th>Impuesto</th><th>Importe bruto</th><th>Nota</th><th>Departamento</th><th>Centro de costos</th><th>Clase</th><th></th></tr></thead><tbody id="lines"></tbody></table><button id="add">+ Agregar línea</button></div></section><p id="error"></p><footer><button id="cancel" class="button-secondary" type="button">Cancelar</button><button id="save">Guardar factura</button></footer></main><div id="successModal" class="success-modal" hidden><div class="success-card"><div class="success-icon">✓</div><h2>Factura generada exitosamente</h2><p id="successMessage"></p><div class="success-actions"><button id="acceptSuccess" class="button-secondary" type="button">Aceptar</button><a href="/sales-invoice-entry.html">Nueva factura</a></div></div></div><script type="module" src="/sales-invoice-entry.js?v=4"></script></body></html>
